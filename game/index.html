<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wispward — keep the light, outlast the swarm</title>
<style>
  html, body { margin: 0; height: 100%; background: #04060f; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  #game {
    display: block;
    width: min(100vw, 160vh); /* the field is 1280x800, an 8:5 stage, letterboxed by the page */
    aspect-ratio: 8 / 5;
    background: #070b1d;
    box-shadow: 0 0 90px rgba(20, 26, 66, 0.9);
    touch-action: none;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800" aria-label="Wispward: steer the wisp with WASD or the arrow keys, aim with the mouse, and hold click to fire sparks at the swarm"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
